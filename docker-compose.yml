version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: election_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-election_db}
      POSTGRES_USER: ${POSTGRES_USER:-election_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-election_secret_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-election_user} -d ${POSTGRES_DB:-election_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: election_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: election_api
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 "app:create_app()"
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-election_user}:${POSTGRES_PASSWORD:-election_secret_pass}@postgres:5432/${POSTGRES_DB:-election_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-prod_super_secret_key_change_me_12345}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt_super_secret_key_change_me_12345}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: election_worker
    command: celery -A app.celery_app.celery worker --loglevel=info -c 4
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-election_user}:${POSTGRES_PASSWORD:-election_secret_pass}@postgres:5432/${POSTGRES_DB:-election_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-prod_super_secret_key_change_me_12345}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt_super_secret_key_change_me_12345}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: