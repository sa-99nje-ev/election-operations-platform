name: Election Operations Platform CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint, Test, and Coverage Analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: election_db_test
          POSTGRES_USER: election_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U election_user -d election_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://election_user:test_password@localhost:5432/election_db_test
        run: |
          alembic upgrade head

      - name: Lint Code Base with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

          # Treat remaining style issues as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Execute Pytest Suite with Coverage
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql+asyncpg://election_user:test_password@localhost:5432/election_db_test
          REDIS_URL: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test_secret_key_12345
          JWT_SECRET_KEY: test_jwt_secret_key_12345
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing tests/

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Validate Docker Build and Compose Services
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: election-operations-platform:latest

      - name: Validate Docker Compose Orchestration
        env:
          SECRET_KEY: ci_secret_key_12345
          JWT_SECRET_KEY: ci_jwt_secret_key_12345
        run: |
          docker compose config