name: Election Operations Platform CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  lint-and-test:
    name: Lint, Test, and Coverage Analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: election_db_test
          POSTGRES_USER: election_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U election_user -d election_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Code Base
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Execute Pytest Suite with Coverage
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+asyncpg://election_user:test_password@localhost:5432/election_db_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test_secret_key
          JWT_SECRET_KEY: test_jwt_secret_key
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing tests/

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  docker-build:
    name: Build and Validate Complete Docker Stack
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        env:
          SECRET_KEY: ci_secret_key
          JWT_SECRET_KEY: ci_jwt_secret_key
        run: |
          docker compose config

      - name: Build Complete Docker Stack
        env:
          SECRET_KEY: ci_secret_key
          JWT_SECRET_KEY: ci_jwt_secret_key
        run: |
          docker compose build

      - name: Start Complete Docker Stack
        env:
          SECRET_KEY: ci_secret_key
          JWT_SECRET_KEY: ci_jwt_secret_key
        run: |
          docker compose up -d

      - name: Wait for Services
        run: |
          echo "Waiting for PostgreSQL, Redis, API, Worker, and Dashboard..."
          sleep 20
          docker compose ps

      - name: Test FastAPI Health Endpoint
        run: |
          for i in {1..12}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "FastAPI health check passed."
              exit 0
            fi
            echo "FastAPI not ready yet..."
            sleep 5
          done
          echo "FastAPI health check failed."
          exit 1

      - name: Test Dashboard
        run: |
          for i in {1..12}; do
            if curl --fail --silent http://localhost:8050/ > /dev/null; then
              echo "Dashboard health check passed."
              exit 0
            fi
            echo "Dashboard not ready yet..."
            sleep 5
          done
          echo "Dashboard health check failed."
          exit 1

      - name: Verify Worker Is Running
        run: |
          if docker compose ps worker | grep -q "Up"; then
            echo "ARQ worker is running."
          else
            echo "ARQ worker is not running."
            docker compose logs worker
            exit 1
          fi

      - name: Show Service Status
        if: always()
        run: |
          docker compose ps

      - name: Show Service Logs
        if: failure()
        run: |
          docker compose logs --no-color

      - name: Stop Docker Stack
        if: always()
        run: |
          docker compose down -v
